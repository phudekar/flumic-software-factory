# Bootstrap profile for planning, triage and review workers.
# Standalone workers read this file on start. The control plane imports it only
# when the profile store is empty. Editing this file
# does not overwrite saved profiles; edit those in the UI. Workers load saved
# profile changes on restart. Shared factory settings and credentials stay separate.

# Reference-file schema version, independent of the saved profile revision number.
version: 1
# Human-readable saved profile name shown in the control pane.
name: default
# Existing factory worker type to inherit; simple handles planning/triage/review.
profile: simple
# Standalone registration and repository access policy for this worker type.
worker:
  # Workflow task registration type.
  worker_type: simple
  # Standalone engine worker name; managed workers receive a unique name.
  worker_name: software-factory-simple-worker
  # Allowed path policy: source files or the complete repository.
  path_policy: source
# Worker-local overrides; missing values inherit the pinned factory revision.
document:
  # Worker models, execution limits, logging and startup behavior.
  settings:
    # Base OS image used to build a managed worker; empty uses the legacy prebuilt image.
    base_image: python:3.12-slim
    # Extra apt/apk package names; use names available in the chosen distribution.
    system_packages: []
    # Trusted build-time shell commands; no credentials. Cached with the image.
    image_setup_script: ''
    # Pinned CLI package versions, installed only for the selected coding adapter.
    codex_version: '0.163.0'
    # Pinned Claude CLI package version; ignored when the selected tool is not Claude.
    claude_version: '2.1.306'
    # Coding adapter if this worker type is assigned coding: api, codex or claude.
    developer_agent: api
    # Model for API-based planning, triage, review and API coding.
    openai_model: gpt-5-nano
    # Maximum number of incremental coding rounds (1–20).
    max_patch_iterations: 10
    # Maximum changed files in one round (1–5); total cap is rounds × this value.
    max_files_per_iteration: 5
    # Maximum UTF-8 bytes per source/output file; 65536 bytes is 64 KiB.
    max_file_bytes: 65536
    # Total API request budget, including reserved completion tokens.
    max_context_tokens: 32000
    # API completion token reservation; must be below max_context_tokens.
    max_completion_tokens: 16000
    # API-client retries (0–20); shared workflow/engine retries are configured separately.
    api_max_retries: 2
    # Timeout in seconds for an API-client request, independent of engine task timeouts.
    api_timeout_seconds: 90
    # Minimum Python log severity: DEBUG, INFO, WARNING, ERROR or CRITICAL.
    log_level: INFO
    # Runtime log encoding: json (structured) or text.
    log_format: json
    # Conversation history mode: redacted, metadata_only or disabled.
    conversation_capture: redacted
    # Optional trusted /bin/sh -eu script, run before registration on every start.
    # Keep commands idempotent; use injected environment credentials, never literals.
    startup_script: ''
    # Maximum startup script duration in seconds (1–3600); failure stops startup.
    startup_timeout_seconds: 600
  # Per-task overrides; unlisted tasks retain their inherited model and guidance.
  tasks:
    # Settings for the plan_issue workflow task; routing/retries stay factory-owned.
    plan_issue:
      # Null uses the worker's backend model; a string overrides it for this task.
      model: null
      # Additional system guidance replaces inherited task guidance, but preserves
      # built-in safety instructions and required response schemas (16000 chars max).
      additional_system_prompt: |
        Use the issue and resolved discussion to identify the requested outcome and constraints.
        Ask only blocking questions that would change implementation; do not reopen resolved decisions.
        When selecting context, use only relevant paths from the supplied inventory, including tests.
        When producing tasks, prefer one cohesive task unless work is safely independent. Avoid
        shared-file ownership, hidden ordering dependencies, overlapping scope and speculative features.
        For each task, use a concrete title and an objective stating behavior, scope and relevant
        interfaces. Provide 1-5 acceptance criteria describing an input or trigger, observable outcome
        and a feasible check. Cover the main success case and material failure/regression cases when
        relevant. Do not invent paths, APIs, product requirements or claims of inspected source.
        Keep reasoning grounded in supplied evidence; distinguish missing information from assumptions.
        Use only the fields of the schema requested by the current call: planning and context selection
        have different schemas. Put useful detail in objective/acceptance_criteria when those fields
        exist; never add fields, prose outside JSON, or claim tests were run.
    # Settings for the triage_issue workflow task.
    triage_issue:
      # Null uses openai_model; set a model identifier for a task-specific choice.
      model: null
      # Extra system guidance for triage; deterministic tasks ignore this field.
      additional_system_prompt: |
        Decide whether the requested behavior is actionable from the issue and resolved discussion.
        Request clarification only for blocking ambiguity that materially changes implementation.
        Questions should identify the missing decision, not ask for secrets, approval of routine
        implementation choices, or information already resolved. Respect a resolved discussion.
        Select up to five relevant source_paths from the provided inventory: prioritize the entry
        point, behavior owner and relevant tests. Do not infer file contents from names or invent paths.
        Return needs_discussion, questions and source_paths in the required JSON schema. Keep questions
        empty when no clarification is needed. Do not add rationale fields or claim implementation,
        validation or completion; this stage evaluates readiness, not the finished change.
