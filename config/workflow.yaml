# Task prompts supplement built-in safety instructions and response schemas.
# Non-model tasks expose the same field, but do not send a prompt to a provider.
defaults:
  scan_cron: '*/5 * * * *'
  workflow_concurrency: 3
  # Active-run deduplication safety TTL; completion normally releases the key.
  workflow_dedup_ttl_seconds: 86400
  discussion_poll_seconds: 30
  max_patch_iterations: 10
  max_files_per_iteration: 5
  max_file_bytes: 65536
  worker_label_key: worker_type
  labels:
    needs_discussion: needs-discussion
    ready_for_agent: ready-for-agent
    pr_open: agent-pr-open
    pr_reviewed: agent-pr-reviewed
    plan_created: agent-plan-created
    plan_subtask: agent-subtask
task_defaults:
  # Allow queued tasks to wait behind long coding runs (separate from execution).
  schedule_timeout_seconds: 86400
  # Wait for a competing issue owner before asking the engine to retry.
  lock_wait_seconds: 30
  worker_type: simple
  retries: 2
  backoff_factor: 2.0
  backoff_max_seconds: 30
task_templates:
  coding:
    worker_type: developer
    timeout_seconds: 3600
  wait:
    timeout_seconds: 2592000
    retries: 0
tasks:
  load_issue:
    additional_system_prompt: ""  # Deterministic task; no model call.
    timeout_seconds: 120
  plan_issue:
    additional_system_prompt: |
      Use the issue and resolved discussion to identify the requested outcome and constraints.
      Ask only blocking questions that would change implementation; do not reopen resolved decisions.
      When selecting context, use only relevant paths from the supplied inventory, including tests.
      When producing tasks, prefer one cohesive task unless work is safely independent. Avoid
      shared-file ownership, hidden ordering dependencies, overlapping scope and speculative features.
      For each task, use a concrete title and an objective stating behavior, scope and relevant
      interfaces. Provide 1-5 acceptance criteria describing an input or trigger, observable outcome
      and a feasible check. Cover the main success case and material failure/regression cases when
      relevant. Do not invent paths, APIs, product requirements or claims of inspected source.
      Keep reasoning grounded in supplied evidence; distinguish missing information from assumptions.
      Use only the fields of the schema requested by the current call: planning and context selection
      have different schemas. Put useful detail in objective/acceptance_criteria when those fields
      exist; never add fields, prose outside JSON, or claim tests were run.
    timeout_seconds: 480
    concurrency: 1
  triage_issue:
    additional_system_prompt: |
      Decide whether the requested behavior is actionable from the issue and resolved discussion.
      Request clarification only for blocking ambiguity that materially changes implementation.
      Questions should identify the missing decision, not ask for secrets, approval of routine
      implementation choices, or information already resolved. Respect a resolved discussion.
      Select up to five relevant source_paths from the provided inventory: prioritize the entry
      point, behavior owner and relevant tests. Do not infer file contents from names or invent paths.
      Return needs_discussion, questions and source_paths in the required JSON schema. Keep questions
      empty when no clarification is needed. Do not add rationale fields or claim implementation,
      validation or completion; this stage evaluates readiness, not the finished change.
    timeout_seconds: 180
  generate_and_open_draft_pr:
    additional_system_prompt: |
      Implement the issue's acceptance criteria using existing architecture and dependency choices.
      Check each criterion against available context; keep changes focused and handle material error
      paths and compatibility. Add relevant regression tests or documentation when behavior changes.
      Do not expand scope, weaken safety checks, or use placeholders to simulate completed behavior.
      When tools are available, run relevant checks and repair failures caused by the change. When
      unavailable, report checks as not run; static reasoning is not execution evidence.
      Use pull_title for the concrete outcome. In pull_body, write concise Markdown sections:
      Summary (behavior and affected modules), Acceptance criteria (criterion to change/evidence),
      Validation (commands actually run and their observed results, or not run with reason), and
      Limitations (unresolved risks, assumptions or remaining work; say none known only when supported).
      Respect the 4000-character pull_body and 1000-character progress limits. Prefer specific evidence
      over repeated narrative. Use progress to record completed work and exact next steps across rounds.
      Set is_complete only when all requested implementation work is present; explicitly distinguish
      implementation completeness from unperformed validation. Never fabricate checks, artifacts or paths.
      Respect configured file/iteration limits, allowed paths, safety instructions and the required
      JSON schema. If the current schema includes changes, supply complete replacement file contents,
      not snippets or diffs. For CLI execution, edit workspace files and return metadata only;
      do not add a changes field when the completion schema excludes it.
    template: coding
    retries: 1
  review_opened_pull_request:
    additional_system_prompt: |
      Evaluate the diff against the issue, acceptance criteria and resolved discussion using the
      supplied code. When selecting context, choose only relevant supplied paths. Check behavior,
      error handling, regressions, authorization/data isolation and validation relevant to this change.
      If this call requests context selection, return only needs_discussion, questions and
      source_paths; the finding instructions below apply only to the review schema.
      For each finding, describe the concrete trigger, evidence in the supplied code, user-visible
      impact and a focused correction in description. Use a valid context path and a supported line
      when available; do not invent locations. Calibrate severity by impact and likelihood, not tone.
      Classify demonstrated defects as bug and optional improvements as suggestion. Prioritize and
      deduplicate findings, reporting at most ten. Do not turn absent execution evidence alone into
      a proven bug, invent product requirements, or request generic style changes.
      Return findings: [] for a clean supplied diff. Missing context is not evidence of a defect;
      only report an issue when its trigger and consequence can be supported. Never claim checks ran
      or certify the whole system from a partial diff. Preserve the current call's JSON schema and
      field limits; do not add verdict, score, rationale or other unsupported fields.
    timeout_seconds: 300
  record_workflow_result:
    additional_system_prompt: ""  # Deterministic task; no model call.
    timeout_seconds: 30
    retries: 0
  verify_merged_pr:
    additional_system_prompt: ""  # Deterministic task; no model call.
    timeout_seconds: 120
    retries: 3
    backoff_max_seconds: 60
  process_pull_request_feedback:
    additional_system_prompt: |
      Evaluate supplied feedback against the issue, current code and resolved discussion. Select
      context only from relevant supplied paths. Implement actionable corrections with the smallest
      coherent change; preserve working behavior and add regression coverage where practical.
      Do not interpret approval, a question or an unrelated suggestion as a new requirement. If a
      request conflicts with safety, scope or available context, explain the unresolved blocker
      rather than silently accepting it or claiming it was addressed. Do not undo prior fixes.
      If this call requests context selection, return only needs_discussion, questions and
      source_paths. Apply the artifact instructions below only when the schema provides those fields.
      Use pull_body sections Summary, Acceptance criteria, Validation and Limitations. Identify
      addressed feedback and unresolved requests using supplied references when available; never
      invent comment IDs. Describe the change and evidence rather than merely saying fixed.
      Run relevant checks when tools are available; report actual commands/results, or not run and
      why. Keep implementation completeness distinct from validation not performed.
      Use progress for addressed requests, unresolved blockers and the next concrete step across
      rounds. Respect the 4000-character pull_body, 1000-character progress, file and iteration limits.
      Preserve the required JSON schema and built-in safety instructions; no extra fields or prose
      outside JSON, no fabricated test results, and no complete claim with implementation remaining.
    template: coding
    concurrency: 1
  scan_pending_issues:
    additional_system_prompt: ""  # Deterministic task; no model call.
    timeout_seconds: 240
    concurrency: 1
  scan_open_pr_feedback:
    additional_system_prompt: ""  # Deterministic task; no model call.
    timeout_seconds: 60
    concurrency: 1
  handle_github_issue_event:
    additional_system_prompt: ""  # Deterministic task; no model call.
    timeout_seconds: 60
  handle_pull_request_feedback_event:
    additional_system_prompt: ""  # Deterministic task; no model call.
    timeout_seconds: 60
    concurrency: 1
  inspect_pull_request_event:
    additional_system_prompt: ""  # Deterministic task; no model call.
    timeout_seconds: 30
    retries: 0
  trigger_issue_from_sample_event:
    additional_system_prompt: ""  # Deterministic task; no model call.
    timeout_seconds: 60
  wait_for_ready_for_agent:
    additional_system_prompt: ""  # Deterministic task; no model call.
    template: wait
  wait_for_pull_review:
    additional_system_prompt: ""  # Deterministic task; no model call.
    template: wait
