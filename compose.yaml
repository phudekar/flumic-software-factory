# Runtime settings live in worker-config.yaml; only credentials and config selectors are passed here.
services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      WORKER_CONFIG_FILE: /config/worker-config.yaml
      WORKER_PROFILE: simple
      HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN:?Load the Hatchet development profile
        before starting workers}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?Set GITHUB_TOKEN in the root .env file}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    restart: unless-stopped
    volumes:
    - ./shared:/shared
    - ./data:/data
    - ./worker-config.yaml:/config/worker-config.yaml:ro
    - ./config:/config/config:ro
    networks:
    - workers
  developer-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile.developer
    environment:
      WORKER_CONFIG_FILE: /config/worker-config.yaml
      WORKER_PROFILE: developer
      HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN:?Load the Hatchet development profile
        before starting workers}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?Set GITHUB_TOKEN in the root .env file}
      OPENAI_API_KEY: ${DEVELOPER_OPENAI_API_KEY:-${OPENAI_API_KEY:-}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    healthcheck:
      test:
      - CMD
      - python
      - /worker/codex_healthcheck.py
      interval: 10m
      timeout: 75s
      retries: 2
      start_period: 1m
    restart: unless-stopped
    volumes:
    - ./shared:/shared
    - ./data:/data
    - ./worker-config.yaml:/config/worker-config.yaml:ro
    - ./config:/config/config:ro
    networks:
    - workers
networks:
  workers:
    name: worker-network
    driver: bridge
