services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      WORKER_TYPE: simple
      DEVELOPER_AGENT: api
      HATCHET_WORKER_NAME: software-factory-simple-worker
      HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN:?Load the Hatchet development profile before starting workers}
      HATCHET_CLIENT_TLS_STRATEGY: ${HATCHET_CLIENT_TLS_STRATEGY:-tls}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?Set GITHUB_TOKEN in the root .env file}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-phudekar/software-factory}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in the root .env file}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      MAX_PATCH_ITERATIONS: ${MAX_PATCH_ITERATIONS:-10}
    restart: unless-stopped
    volumes:
      - ./shared:/shared
      - ./data:/data
    networks:
      - workers
  developer-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile.developer
      args:
        DEVELOPER_AGENT: ${DEVELOPER_AGENT:-codex}
    environment:
      WORKER_TYPE: developer
      DEVELOPER_AGENT: ${DEVELOPER_AGENT:-codex}
      HATCHET_WORKER_NAME: software-factory-developer-worker
      HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN:?Load the Hatchet development profile before starting workers}
      HATCHET_CLIENT_TLS_STRATEGY: ${HATCHET_CLIENT_TLS_STRATEGY:-tls}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?Set GITHUB_TOKEN in the root .env file}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-phudekar/software-factory}
      OPENAI_API_KEY: ${DEVELOPER_OPENAI_API_KEY:-${OPENAI_API_KEY:-}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CODEX_MODEL: ${CODEX_MODEL:-gpt-6-luna}
      MAX_PATCH_ITERATIONS: ${MAX_PATCH_ITERATIONS:-10}
    healthcheck:
      test:
        - CMD-SHELL
        - 'if [ "$$DEVELOPER_AGENT" = codex ]; then python /worker/codex_healthcheck.py; else exit 0; fi'
      interval: 10m
      timeout: 75s
      retries: 2
      start_period: 1m
    restart: unless-stopped
    volumes:
      - ./shared:/shared
      - ./data:/data
    networks:
      - workers

networks:
  workers:
    name: worker-network
    driver: bridge
