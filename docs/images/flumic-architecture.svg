<text x="50" y="797" class="section">APPLICATION ADAPTERS / EXTERNAL SERVICES</text>
<rect x="50" y="825" width="285" height="117" rx="12" fill="#131e2b" stroke="#33465b"/>
<text x="72" y="859" class="name">GitHub adapter</text>
<text x="72" y="888" class="body">Issues • source • draft PRs</text>
<text x="72" y="911" class="body">Reviews • checks • merge state</text>
<rect x="375" y="825" width="330" height="117" rx="12" fill="#131e2b" stroke="#33465b"/>
<text x="397" y="859" class="name">AI model adapters</text>
<text x="397" y="888" class="body">Planner / reviewer: API</text>
<text x="397" y="911" class="body">Coder: API • Codex • Claude</text>
<rect x="745" y="825" width="300" height="117" rx="12" fill="#131e2b" stroke="#33465b"/>
<text x="767" y="859" class="name">Observation adapters</text>
<text x="767" y="888" class="body">Structured logs + API events</text>
<text x="767" y="911" class="body">Optional OTLP → SigNoz</text>
<rect x="1085" y="825" width="305" height="117" rx="12" fill="#131e2b" stroke="#33465b"/>
<text x="1107" y="859" class="name">Execution-state adapter</text>
<text x="1107" y="888" class="body">SQLite + local file locks</text>
<text x="1107" y="911" class="body">Plans • patches • claims</text>
<text x="50" y="986" class="body">Solid arrows: control / execution / state access. Dashed mint: configuration + observation paths.</text>
<text x="50" y="1025" class="sub">PostgreSQL stores control data; SQLite stores worker execution state. These have separate responsibilities.</text>
<text x="50" y="1064" class="sub">Today: GitHub + Docker + shared local state. Coming soon: GitLab workflows and Kubernetes orchestration.</text>
</svg>
