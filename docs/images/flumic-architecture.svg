<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title description">
<title id="title">Flumic AI: control plane, execution plane and integration boundaries</title>
<desc id="description">Operators use the React UI and FastAPI API. PostgreSQL stores configuration and durable lifecycle commands. A reconciler uses the Docker runtime adapter to manage simple and developer workers. Hatchet schedules their stages. Workers fetch configuration and report events to the API; their application and domain logic uses adapters for GitHub, AI models, shared SQLite state, and optional OpenTelemetry. Current workers share one host; GitLab and Kubernetes are planned.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="m0 0 9 4.5L0 9Z" fill="#8fa9bf"/></marker><marker id="mint" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="m0 0 9 4.5L0 9Z" fill="#82e4bd"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:32px;font-weight:700;fill:#eff5fa}.sub{font-size:18px;fill:#aebfce}.name{font-size:23px;font-weight:700;fill:#e5eef6}.body{font-size:17px;fill:#b8cad8}.label{font-size:15px;fill:#afc3d4}.section{font-size:14px;font-weight:700;letter-spacing:2px;fill:#82e4bd}.edge{fill:none;stroke:#8fa9bf;stroke-width:2;marker-end:url(#arrow)}.data{fill:none;stroke:#82e4bd;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#mint)}</style>
