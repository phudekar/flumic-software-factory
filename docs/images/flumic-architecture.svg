<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1380" viewBox="0 0 1600 1380" role="img" aria-labelledby="title description">
<title id="title">Flumic AI: projects, shared execution and runtime authority</title>
<desc id="description">Seven conceptual layers with component icons: developer experience; Control Plane with project revisions, API and reconciler; Hatchet scheduling; shared role-based workers and application operations; Docker and native Kubernetes runtime targets; repository, model, state and telemetry adapters; PostgreSQL authority and legacy local persistence. Kubernetes uses worker Deployments, private retained PVCs and one-time action Jobs. PostgreSQL claims and immutable pins coordinate runtime effects. Observability spans project, run, stage and attempt identity, logs, traces, model tokens and cost. Arrows are conceptual dependencies, not runtime call routing.</desc>
