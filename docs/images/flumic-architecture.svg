<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110" role="img" aria-labelledby="title description">
<title id="title">Flumic AI layered architecture</title>
<desc id="description">Six responsibility layers: developer experience with React UI; Control Plane with API, profiles and reconciler; Hatchet workflow orchestration; simple and developer worker execution with shared application and domain policy; repository, model, state and telemetry adapters; Docker and PostgreSQL control and dynamic execution data plus legacy SQLite state. Observability spans the layers with logs, metrics, traces and model accounting. Arrows indicate conceptual dependencies, not a synchronous request sequence. GitLab and Kubernetes are planned.</desc>
