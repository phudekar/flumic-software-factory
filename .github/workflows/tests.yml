name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r worker/requirements.txt
      - name: Run worker tests
        run: python -m unittest discover -s tests -q

  backend:
    name: Control-plane backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: flumic-ci-test
          POSTGRES_DB: flumic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: control-plane/backend/requirements.lock
      - name: Install dependencies
        run: python -m pip install -r control-plane/backend/requirements.lock
      - name: Run backend tests
        env:
          PYTHONPATH: worker:control-plane/backend
        run: python -m unittest discover -s control-plane/backend/tests -q
      - name: Run PostgreSQL ownership, migration and concurrency tests
        env:
          PYTHONPATH: worker:control-plane/backend
          CONTROL_TEST_DATABASE_URL: postgresql+psycopg://postgres:flumic-ci-test@127.0.0.1:5432/flumic_test
          CONTROL_MIGRATION_TEST_URL: postgresql+psycopg://postgres:flumic-ci-test@127.0.0.1:5432/flumic_test
        run: python -m unittest discover -s control-plane/backend/tests -q

  frontend:
    name: Control-plane frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: control-plane/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: control-plane/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
