name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_docker_contracts:
        description: Run deterministic local Docker job contracts
        type: boolean
        default: false
      run_hatchet_contracts:
        description: Run isolated Hatchet and mixed-project Docker release contracts (test tenant secrets required)
        type: boolean
        default: false

      run_gitlab_contracts:
        description: Run live GitLab.com qualification against a pinned disposable project
        type: boolean
        default: false
      allow_gitlab_default_branch_changes:
        description: Approve temporary CI/default-branch commits and their guarded cleanup in the disposable GitLab project
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r worker/requirements.txt
      - name: Run worker tests
        run: python -m unittest discover -s tests -q

  backend:
    name: Control-plane backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: flumic-ci-test
          POSTGRES_DB: flumic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: control-plane/backend/requirements.lock
      - name: Install dependencies
        run: python -m pip install -r control-plane/backend/requirements.lock
      - name: Run backend tests
        env:
          PYTHONPATH: worker:control-plane/backend
        run: python -m unittest discover -s control-plane/backend/tests -q
      - name: Run PostgreSQL ownership, migration and concurrency tests
        env:
          PYTHONPATH: worker:control-plane/backend
          CONTROL_TEST_DATABASE_URL: postgresql+psycopg://postgres:flumic-ci-test@127.0.0.1:5432/flumic_test
          CONTROL_MIGRATION_TEST_URL: postgresql+psycopg://postgres:flumic-ci-test@127.0.0.1:5432/flumic_test
        run: python -m unittest discover -s control-plane/backend/tests -q

  frontend:
    name: Control-plane frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: control-plane/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: control-plane/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build


  docker-contracts:
    name: Opt-in Docker runtime contracts
    if: github.event_name == 'workflow_dispatch' && inputs.run_docker_contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: control-plane/backend/requirements.lock
      - run: python -m pip install -r control-plane/backend/requirements.lock
      - name: Resolve immutable fixture image
        run: |
          docker pull python:3.12-slim
          docker image inspect python:3.12-slim --format 'DOCKER_JOB_CONTRACT_IMAGE={{index .RepoDigests 0}}' >> "$GITHUB_ENV"
      - name: Run no-provider Docker contract
        env:
          RUN_DOCKER_JOB_CONTRACT: '1'
        run: python -m unittest discover -s tests/integration -p test_docker_job_contract.py -v

  hatchet-contracts:
    name: Opt-in project release contracts
    if: github.event_name == 'workflow_dispatch' && inputs.run_hatchet_contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: flumic-ci-test
          POSTGRES_DB: flumic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HATCHET_CLIENT_TOKEN: ${{ secrets.FLUMIC_RELEASE_HATCHET_TOKEN }}
      HATCHET_CLIENT_HOST_PORT: ${{ secrets.FLUMIC_RELEASE_HATCHET_HOST_PORT }}
      HATCHET_CLIENT_SERVER_URL: ${{ secrets.FLUMIC_RELEASE_HATCHET_SERVER_URL }}
      HATCHET_CLIENT_TLS_STRATEGY: ${{ vars.FLUMIC_RELEASE_HATCHET_TLS_STRATEGY || 'tls' }}
      CONTROL_TEST_DATABASE_URL: postgresql+psycopg://postgres:flumic-ci-test@127.0.0.1:5432/flumic_test
      FLUMIC_LIVE_HATCHET: '1'
      FLUMIC_LIVE_PROJECT_RELEASE: '1'
      FLUMIC_LIVE_EVIDENCE_DIR: output/runtime-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: control-plane/backend/requirements.lock
      - name: Require an explicitly configured test tenant
        run: python -c "import os; assert all(os.environ.get(key) for key in ('HATCHET_CLIENT_TOKEN','HATCHET_CLIENT_HOST_PORT','HATCHET_CLIENT_SERVER_URL')), 'Configure all FLUMIC_RELEASE_HATCHET_* test-tenant secrets before opting in'"
      - run: python -m pip install -r control-plane/backend/requirements.lock
      - name: Resolve immutable fixture image
        run: |
          docker pull python:3.12-slim
          docker image inspect python:3.12-slim --format 'DOCKER_JOB_CONTRACT_IMAGE={{index .RepoDigests 0}}' >> "$GITHUB_ENV"
      - name: Verify live engine replay and cancellation contracts
        run: python -m unittest discover -s tests/integration -p test_hatchet_dynamic_contract.py -v
      - name: Verify the complete project/shared-worker/Docker path
        run: python -m unittest discover -s tests/integration -p test_project_release_contract.py -v
      - name: Upload public protocol evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-protocol-evidence
          if-no-files-found: ignore
          path: |
            output/runtime-evidence/project-release-*.json
            output/runtime-evidence/flumic-contract-*/effects.jsonl
            output/runtime-evidence/flumic-contract-*/entries.jsonl
            output/runtime-evidence/flumic-contract-*/frontiers.jsonl


  gitlab-contracts:
    name: Opt-in live GitLab.com contracts
    if: github.event_name == 'workflow_dispatch' && inputs.run_gitlab_contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: tests:worker
      FLUMIC_LIVE_GITLAB: '1'
      FLUMIC_GITLAB_ALLOW_WRITES: '1'
      FLUMIC_GITLAB_ALLOW_DEFAULT_BRANCH_CHANGES: ${{ inputs.allow_gitlab_default_branch_changes && '1' || '0' }}
      FLUMIC_GITLAB_PROJECT_PATH: ${{ vars.FLUMIC_RELEASE_GITLAB_PROJECT_PATH }}
      FLUMIC_GITLAB_PROJECT_ID: ${{ vars.FLUMIC_RELEASE_GITLAB_PROJECT_ID }}
      FLUMIC_GITLAB_DEFAULT_BRANCH: ${{ vars.FLUMIC_RELEASE_GITLAB_DEFAULT_BRANCH }}
      FLUMIC_GITLAB_DEFAULT_SHA: ${{ vars.FLUMIC_RELEASE_GITLAB_DEFAULT_SHA }}
      GITLAB_TOKEN: ${{ secrets.FLUMIC_RELEASE_GITLAB_TOKEN }}
      FLUMIC_LIVE_EVIDENCE_DIR: output/gitlab-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: python -m pip install -r worker/requirements.txt
      - name: Require explicit scoped mutation configuration
        run: python -c 'import os; from integration.gitlab_live_fixture import LiveGitLabConfig; LiveGitLabConfig.from_env(os.environ)'
      - name: Qualify real GitLab HTTP, Git publication and CI
        run: python -m unittest integration.test_gitlab_contract -v
      - name: Upload public GitLab protocol inventory only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitlab-protocol-evidence
          if-no-files-found: ignore
          path: output/gitlab-evidence/gitlab-contract-*.json
