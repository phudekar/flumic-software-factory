name: factory-control
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: factory_control
      POSTGRES_USER: factory_control
      POSTGRES_PASSWORD: ${CONTROL_DB_PASSWORD:?Run scripts/start-control-plane.sh}
    volumes:
      - ${CONTROL_DB_DATA_PATH:-control-db}:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U factory_control -d factory_control']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    image: software-factory-control:local
    container_name: factory-control-api
    environment: &backend
      CONTROL_DATABASE_URL: postgresql+psycopg://factory_control:${CONTROL_DB_PASSWORD}@postgres:5432/factory_control
      CONTROL_ADMIN_PASSWORD: ${CONTROL_ADMIN_PASSWORD:?Run scripts/start-control-plane.sh}
      CONTROL_ENCRYPTION_KEY: ${CONTROL_ENCRYPTION_KEY:?Run scripts/start-control-plane.sh}
      CONTROL_PUBLIC_ORIGIN: ${CONTROL_PUBLIC_ORIGIN:-http://localhost:3400}
      CONTROL_WORKER_ENDPOINT: http://factory-control-api:8000
      FACTORY_ROOT: /factory
      FACTORY_HOST_ROOT: ${FACTORY_HOST_ROOT:?Run scripts/start-control-plane.sh}
      HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEVELOPER_OPENAI_API_KEY: ${DEVELOPER_OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes: &volumes
      - .:/factory:ro
      - ./data/control-plane:/factory/data/control-plane
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 127.0.0.1:3400:8000
    command: [sh, -c, 'alembic upgrade head && exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --no-access-log']
    depends_on:
      postgres:
        condition: service_healthy
    networks: [default, workers]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/v1/health",timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  reconciler:
    image: software-factory-control:local
    environment: *backend
    volumes: *volumes
    command: [python, -m, app.reconciler]
    depends_on:
      api:
        condition: service_healthy
    networks: [default, workers]
    restart: unless-stopped
networks:
  workers:
    external: true
    name: worker-network
volumes:
  control-db:
