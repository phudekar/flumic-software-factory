# Core services. Use scripts/start-control-plane.sh for the default local DB overlay.
name: factory-control
services:
  api:
    build: &control-build
      context: .
      dockerfile: control-plane/Dockerfile
    image: software-factory-control:local
    container_name: factory-control-api
    environment: &backend
      CONTROL_DATABASE_URL: ${CONTROL_DATABASE_URL:-}
      CONTROL_ADMIN_PASSWORD: ${CONTROL_ADMIN_PASSWORD:?Run scripts/start-control-plane.sh}
      CONTROL_ENCRYPTION_KEY: ${CONTROL_ENCRYPTION_KEY:?Run scripts/start-control-plane.sh}
      CONTROL_PUBLIC_ORIGIN: ${CONTROL_PUBLIC_ORIGIN:-http://localhost:3400}
      CONTROL_WORKER_ENDPOINT: http://factory-control-api:8000
      CONTROL_RUNTIME_NAMESPACE: ${CONTROL_RUNTIME_NAMESPACE:-flumic-dynamic-v1}
      FACTORY_SHARED_TELEMETRY_ENDPOINT: ${FACTORY_SHARED_TELEMETRY_ENDPOINT:-}
      FACTORY_SHARED_DEPLOYMENT_ENVIRONMENT: ${FACTORY_SHARED_DEPLOYMENT_ENVIRONMENT:-development}
      CONTROL_JOB_BRIDGE: ${CONTROL_JOB_BRIDGE:-}
      FACTORY_ROOT: /factory
      FACTORY_HOST_ROOT: ${FACTORY_HOST_ROOT:?Run scripts/start-control-plane.sh}
      HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEVELOPER_OPENAI_API_KEY: ${DEVELOPER_OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes: &volumes
    - .:/factory:ro
    - ./data/control-plane:/factory/data/control-plane
    - /var/run/docker.sock:/var/run/docker.sock
    ports:
    - 127.0.0.1:3400:8000
    command:
    - uvicorn
    - app.main:create_app
    - --factory
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    - --no-access-log
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
    - default
    - workers
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen("http://localhost:8000/api/v1/health",timeout=3)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  reconciler:
    image: software-factory-control:local
    environment: *backend
    volumes: *volumes
    command:
    - python
    - -m
    - app.reconciler
    depends_on:
      api:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
    - default
    - workers
    restart: unless-stopped
  dynamic-runtime:
    image: software-factory-control:local
    environment:
      CONTROL_DATABASE_URL: ${CONTROL_DATABASE_URL:-}
      CONTROL_ADMIN_PASSWORD: ${CONTROL_ADMIN_PASSWORD:?Run scripts/start-control-plane.sh}
      CONTROL_ENCRYPTION_KEY: ${CONTROL_ENCRYPTION_KEY:?Run scripts/start-control-plane.sh}
      FACTORY_ROOT: /factory
      FACTORY_HOST_ROOT: ${FACTORY_HOST_ROOT:?Run scripts/start-control-plane.sh}
      HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN:-}
      CONTROL_RUNTIME_NAMESPACE: ${CONTROL_RUNTIME_NAMESPACE:-flumic-dynamic-v1}
    volumes:
    - .:/factory:ro
    - ./data/control-plane:/factory/data/control-plane
    command:
    - python
    - -m
    - app.dynamic_runtime
    depends_on:
      api:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
    - default
    - workers
    restart: unless-stopped
  migrate:
    build: *control-build
    image: software-factory-control:local
    environment:
      CONTROL_DATABASE_URL: ${CONTROL_DATABASE_URL:-}
    command:
    - alembic
    - upgrade
    - head
    networks:
    - default
    restart: 'no'
networks:
  workers:
    external: true
    name: worker-network
